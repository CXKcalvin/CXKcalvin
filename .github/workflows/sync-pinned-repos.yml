
name: Sync pinned repositories in README

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

# Harus sama dengan auto-update.yml.
concurrency:
  group: readme-updates
  cancel-in-progress: false
  queue: max

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Update project image URLs
        run: python3 .github/scripts/sync_pinned_repos.py
        env:
          PROFILE_TOKEN: ${{ secrets.PROFILE_TOKEN }}

      - name: Commit and push changes
        run: |
          if git diff --quiet -- README.md; then
            echo "Pinned repository list has not changed."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add README.md
          git commit -m "Sync pinned repositories in README"
          git push origin "HEAD:${GITHUB_REF_NAME}"
