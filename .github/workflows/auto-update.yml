
name: Auto Update README Version

on:
  schedule:
    # GitHub Actions memiliki interval jadwal minimum 5 menit.
    - cron: "*/5 * * * *"
  workflow_dispatch:

# Mencegah workflow ini bentrok dengan workflow sinkronisasi README.
concurrency:
  group: readme-updates
  cancel-in-progress: false
  queue: max

permissions:
  contents: write

jobs:
  update-version:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Update version and README timestamp
        run: |
          python - <<'PY'
          import re
          from datetime import datetime, timezone
          from pathlib import Path

          version_file = Path("version.txt")
          readme_file = Path("README.md")

          # Ambil versi terakhir dari version.txt.
          if not version_file.exists():
              raise SystemExit("File version.txt tidak ditemukan.")

          current_version = version_file.read_text(encoding="utf-8").strip()

          match = re.fullmatch(r"(\d+)\.(\d+)", current_version)
          if not match:
              raise SystemExit(f"Format versi tidak valid: {current_version}")

          major = int(match.group(1))
          minor = int(match.group(2))

          # Naikkan versi minor.
          minor += 1

          # Jika minor melewati 9, naikkan major.
          if minor > 9:
              major += 1
              minor = 0

          new_version = f"{major}.{minor}"

          # Simpan versi terbaru.
          version_file.write_text(new_version + "\n", encoding="utf-8")

          # Baca README.
          content = readme_file.read_text(encoding="utf-8")

          # Gunakan waktu UTC agar konsisten.
          now = datetime.now(timezone.utc).strftime("%Y-%m-%d %H:%M:%S UTC")
          new_comment = f"<!-- Last Auto-Update: {now} -->"

          pattern = r"<!-- Last Auto-Update: .*? -->"

          if re.search(pattern, content):
              content = re.sub(pattern, lambda _: new_comment, content)
          else:
              content = content.rstrip() + "\n\n" + new_comment + "\n"

          readme_file.write_text(content, encoding="utf-8")

          print(f"Versi baru: Update {new_version}")
          print(f"Timestamp: {now}")
          PY

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add README.md version.txt

          if git diff --cached --quiet; then
            echo "Tidak ada perubahan."
            exit 0
          fi

          VERSION=$(cat version.txt)
          git commit -m "Update ${VERSION}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
